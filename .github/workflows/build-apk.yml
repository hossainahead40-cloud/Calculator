
name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "Checking Android SDK..."

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "SDK not found at $ANDROID_HOME"
            echo "Searching common SDK locations..."

            for dir in \
              /usr/local/lib/android/sdk \
              /opt/android-sdk \
              "$HOME/Android/Sdk"
            do
              if [ -d "$dir" ]; then
                echo "SDK found: $dir"
                echo "ANDROID_HOME=$dir" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$dir" >> "$GITHUB_ENV"
                break
              fi
            done
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK command-line tools found."

      - name: Install Android SDK Packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Enable AndroidX
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          cat gradle.properties

      - name: Check Project
        shell: bash
        run: |
          ls -la

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app folder missing."
            exit 1
          fi

      - name: Setup Gradle
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare Gradle Wrapper
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Clean Project
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain 2>&1 | tee build.log
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain 2>&1 | tee build.log
          fi

      - name: Verify APK
        if: success()
        run: |
          find app/build/outputs/apk \
            -type f -name '*.apk' -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK generated successfully."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
