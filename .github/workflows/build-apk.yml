
name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "Checking Android SDK..."
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not configured"
            exit 1
          fi

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager was not found at the expected path"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Android SDK command-line tools found."

      - name: Install Android SDK Packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Project Files
        run: |
          echo "Repository files:"
          ls -la

          echo "Gradle configuration files:"
          find . -maxdepth 3 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradlew' \) -print

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file is missing."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory is missing."
            exit 1
          fi

      - name: Setup Gradle
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Make Gradle Wrapper Executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Clean Project
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail

          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain 2>&1 | tee build.log
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain 2>&1 | tee build.log
          fi

      - name: Verify APK
        run: |
          echo "Searching for APK files..."

          find app/build/outputs/apk \
            -type f -name '*.apk' -print

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
