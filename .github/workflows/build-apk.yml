
name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure AndroidX
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF 'android.useAndroidX=true' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -qxF 'android.enableJetifier=true' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

          echo "AndroidX enabled:"
          cat gradle.properties

      - name: Check Project Structure
        run: |
          echo "Project files:"
          ls -la

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory not found"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle(.kts) not found"
            exit 1
          fi

      - name: Setup Gradle
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Make Gradle Wrapper Executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Clean Project
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew clean \
              --no-daemon \
              --stacktrace \
              --console=plain
          else
            gradle clean \
              --no-daemon \
              --stacktrace \
              --console=plain
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain 2>&1 | tee build.log
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain 2>&1 | tee build.log
          fi

      - name: Verify APK
        if: success()
        run: |
          echo "Checking APK output..."

          find app/build/outputs/apk \
            -type f -name '*.apk' -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
